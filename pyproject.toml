[project]
name = "report-generator"
version = "0.5.0"
description = "Clean a messy transactions CSV and report what changed."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Pinned on purpose: newer ruff versions check more by default, which would change CI results
# without any change to our code. These are the real-bug rules: syntax, unused names, risky patterns.
select = ["E4", "E7", "E9", "F"]
